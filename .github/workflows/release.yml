name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The asset payload (installer/data) is not in the repo, so CI only
      # creates the release entry; attach the zip with tools/package.ps1.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
